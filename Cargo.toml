[package]
name = "fontstrike"
version = "0.1.0"
edition = "2024"
description = "Desktop UFO font editor: glyph outlines, metrics, kerning, and validated TTF export"

[features]
desktop = ["dep:eframe", "dep:rfd", "dep:png", "dep:winit"]

[[bin]]
name = "fontstrike-desktop"
path = "src/bin/desktop.rs"
required-features = ["desktop"]

[dependencies]
norad = { version = "=0.18.4", features = ["kurbo"] }
kurbo = { version = "=0.13.1", features = ["serde"] }
serde = { version = "=1.0.228", features = ["derive"] }
eframe = { version = "=0.30.0", default-features = false, features = ["glow", "default_fonts", "accesskit"], optional = true }
rfd = { version = "=0.15.4", optional = true }
png = { version = "=0.18.1", optional = true }
fontc = { version = "=1.0.0", default-features = false }
ttf-parser = { version = "=0.25.1", features = ["opentype-layout"] }
sha2 = "=0.10.9"
plist = "=1.10.1"
rustybuzz = "=0.20.1"

# Linux and the BSDs: eframe needs a windowing backend; enable both X11 and
# Wayland (the choice is made at runtime).
[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
eframe = { version = "=0.30.0", default-features = false, features = ["x11", "wayland"], optional = true }

# macOS: used only to turn off winit's default app menu (see src/bin/desktop.rs).
[target.'cfg(target_os = "macos")'.dependencies]
winit = { version = "=0.30.13", default-features = false, optional = true }

[dev-dependencies]
serde_json = "=1.0.149"
